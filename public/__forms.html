<!DOCTYPE html>
<html>
<head><title>Netlify Forms Detection</title></head>
<body>
  <form name="quote" netlify netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="quote" />
    <input name="bot-field" />
    <input name="firstName" />
    <input name="lastName" />
    <input name="email" />
    <input name="phone" />
    <input name="businessName" />
    <input name="state" />
    <input name="trade" />
    <input name="yearsInBusiness" />
    <input name="coverageStart" />
    <input name="limitsNeeded" />
    <input name="currentlyHaveWC" />
    <input name="additionalInsured" />
  <input name="amountOfPayroll" />
  <input name="annualGrossSales" />
  <input name="businessDescription" />
  <input name="city" />
  <input name="clericalStaffCount" />
  <input name="coverageForUninsuredSubcontractors" />
  <input name="coverageTypes" />
  <input name="estimatedEmployeeCount" />
  <input name="estimatedEmployeePayroll" />
  <input name="estimatedGrossSales" />
  <input name="estimatedMaterialCosts" />
  <input name="estimatedSubcontractorExpenses" />
  <input name="hasClericalStaff" />
  <input name="hasSalesStaff" />
  <input name="largestProjects" />
  <input name="newVsExistingConstruction" />
  <input name="numberOfEmployees" />
  <input name="officeVsFieldSplit" />
  <input name="ownerDateOfBirth" />
  <input name="ownerNames" />
  <input name="ownerOwnershipPct" />
  <input name="percentSubcontractorsInsured" />
  <input name="priorCarrierName" />
  <input name="priorPolicyExpiration" />
  <input name="priorPolicyNumber" />
  <input name="priorYearEmployeeCount" />
  <input name="priorYearEmployeePayroll" />
  <input name="priorYearGrossSales" />
  <input name="priorYearSubcontractorExpenses" />
  <input name="residentialVsCommercial" />
  <input name="salesStaffCount" />
  <input name="streetAddress" />
  <input name="subcontractorsHaveInsurance" />
  <input name="yearBusinessStarted" />
  <input name="zip" />
  <input name="classCode1" />
  <input name="classCode2" />
  <input name="classCode3" />
  <input name="classCode4" />
  <input name="classCode5" />
  </form>
  <form name="contact" netlify netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="contact" />
    <input name="bot-field" />
    <input name="name" />
    <input name="email" />
    <input name="phone" />
    <input name="subject" />
    <textarea name="message"></textarea>
  </form>
</body>
</html>
